substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: ruxstar-frontend
  _SERVICE_NAME: ruxstar-frontend-serices
  _RUN_SERVICE_ACCOUNT: ruxstar-cloudrun-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _BACKEND_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/ruxstar-frontend:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/ruxstar-frontend:latest
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/ruxstar-frontend
    waitFor: [build-image]

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/ruxstar-frontend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --service-account=${_RUN_SERVICE_ACCOUNT}
      - --set-env-vars=BACKEND_URL=${_BACKEND_URL}
    waitFor: [push-image]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/ruxstar-frontend:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/ruxstar-frontend:latest
